<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002e77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HS Forms">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<title>HyperStrong Site Passdown</title>
<style>
/* Layout: field tool — sticky brand bar, report list, report header with status, tabs, checklist rows that stack on a phone */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#d7dce5; --line-strong:#b9c1cf;
  --fg:#141b2a; --fg-2:#4a5468; --fg-3:#6f788b;
  --brand:#002e77; --brand-fg:#ffffff; --brand-soft:#e3eaf7;
  --pre:#b26a00; --pre-soft:#fbefdc; --cold:#1d63b8; --cold-soft:#e2edfa; --hot:#c2410c; --hot-soft:#fde7dc; --job:#002e77; --job-soft:#e3eaf7; --lift:#0f766e; --lift-soft:#dcf1ee; --pass:#6d28d9; --pass-soft:#ede9fe;
  --pass:#16794a; --pass-soft:#dcf2e6; --fail:#c0262d; --fail-soft:#fbe1e2; --na:#5f6779; --na-soft:#e7e9ee; --warn:#9a5b00; --warn-soft:#fbefdc;
  --focus:#2f6fe0;
  --f-display:"IBM Plex Sans Condensed","IBM Plex Sans Hebrew","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --surface:#161d2a; --surface-2:#1d2636; --line:#2b3547; --line-strong:#3d4a60;
  --fg:#e8ecf3; --fg-2:#b2bacb; --fg-3:#8a93a6; --brand:#163f8a; --brand-fg:#ffffff; --brand-soft:#1c2a48;
  --pre:#f0a63a; --pre-soft:#3a2a12; --cold:#6aa8f5; --cold-soft:#15283f; --hot:#ff8a55; --hot-soft:#3d1f13; --job:#8fb0ff; --job-soft:#1c2a48; --lift:#4fd1c0; --lift-soft:#0f2e2b; --pass:#b79cff; --pass-soft:#261a40;
  --pass:#4fcf8c; --pass-soft:#123326; --fail:#ff6b70; --fail-soft:#3d1719; --na:#a3abbc; --na-soft:#262e3d; --warn:#f0a63a; --warn-soft:#3a2a12;
  --focus:#8fb4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#161d2a; --surface-2:#1d2636; --line:#2b3547; --line-strong:#3d4a60;
  --fg:#e8ecf3; --fg-2:#b2bacb; --fg-3:#8a93a6; --brand:#163f8a; --brand-fg:#ffffff; --brand-soft:#1c2a48;
  --pre:#f0a63a; --pre-soft:#3a2a12; --cold:#6aa8f5; --cold-soft:#15283f; --hot:#ff8a55; --hot-soft:#3d1f13; --job:#8fb0ff; --job-soft:#1c2a48; --lift:#4fd1c0; --lift-soft:#0f2e2b; --pass:#b79cff; --pass-soft:#261a40;
  --pass:#4fcf8c; --pass-soft:#123326; --fail:#ff6b70; --fail-soft:#3d1719; --na:#a3abbc; --na-soft:#262e3d; --warn:#f0a63a; --warn-soft:#3a2a12;
  --focus:#8fb4ff; color-scheme:dark}
.ac-pre{--acc:var(--pre);--acc-soft:var(--pre-soft)} .ac-cold{--acc:var(--cold);--acc-soft:var(--cold-soft)}
.ac-hot{--acc:var(--hot);--acc-soft:var(--hot-soft)} .ac-job{--acc:var(--job);--acc-soft:var(--job-soft)} .ac-lift{--acc:var(--lift);--acc-soft:var(--lift-soft)} .ac-pass{--acc:var(--pass);--acc-soft:var(--pass-soft)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.muted{color:var(--fg-3);font-size:13px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-fg);border-bottom:4px solid var(--acc)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mark{width:28px;height:28px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.topbar h1{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.sync{font-size:12px;opacity:.85;white-space:nowrap}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:20px}

a.btn{text-decoration:none;color:inherit}
a.btn-primary{color:var(--brand-fg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg-3)}
.btn-primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn-primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--brand)}
.btn:disabled{opacity:.5}
.btn-ghost{background:transparent}
.btn-ok{background:var(--pass);border-color:var(--pass);color:#fff}
.btn-danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 50%,transparent);background:transparent}
.btn-sm{padding:4px 9px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--fg-2);text-decoration:underline;text-underline-offset:2px;font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:18px;font-weight:600}
.panel-h .muted{margin-inline-start:auto}
.panel-b{padding:16px}

.hero{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.hero h2{font-size:28px;font-weight:600}
.hero p{margin:4px 0 0;color:var(--fg-2);max-width:62ch}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-size:12.5px;font-weight:500;color:var(--fg-2)}
.inp{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:14px}
.inp:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.inp:disabled{background:var(--surface-2);color:var(--fg-2)}
textarea.inp{resize:vertical;min-height:38px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--surface);cursor:pointer;user-select:none}
.pill input{width:16px;height:16px;margin:0;accent-color:var(--acc)}
.pill:has(input:checked){border-color:var(--acc);background:var(--acc-soft);font-weight:500}
.pill:has(input:disabled){cursor:default}

.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--fg-2)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rlist{display:flex;flex-direction:column}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.ritem:first-child{border-top:0}
.ritem:hover{background:var(--surface-2)}
.ritem .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ritem .t span{font-weight:400;color:var(--fg-3)}
.ritem .s{font-size:12.5px;color:var(--fg-3);grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ritem .d{font-size:12px;color:var(--fg-3);white-space:nowrap}
.empty{padding:32px 16px;text-align:center;color:var(--fg-3)}
.empty strong{display:block;color:var(--fg-2);margin-bottom:4px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.draft{background:var(--na-soft);color:var(--na)}
.chip.submitted{background:var(--brand-soft);color:var(--brand)}
:root[data-theme="dark"] .chip.submitted{color:#9fbcff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.submitted{color:#9fbcff}}
.chip.accepted,.chip.complete{background:var(--pass-soft);color:var(--pass)}
.chip.returned,.chip.fail{background:var(--fail-soft);color:var(--fail)}
.chip.progress{background:var(--acc-soft);color:var(--acc)}
.minibar{width:70px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-flex}
.minibar i{display:block;height:100%;background:var(--acc)}

.rhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rhead .ttl{flex:1;min-width:220px}
.rhead h2{font-size:26px;font-weight:600;overflow-wrap:anywhere;margin-top:6px}
.rhead .meta{color:var(--fg-3);font-size:13px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rhead .acts{display:flex;gap:8px;flex-wrap:wrap}

.statusbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-inline-start:4px solid var(--sc,var(--line-strong));border-radius:var(--r);background:var(--surface)}
.statusbar.submitted{--sc:var(--brand)} .statusbar.accepted{--sc:var(--pass)} .statusbar.returned{--sc:var(--fail)}
.statusbar .msg{flex:1;min-width:220px;font-size:14px}
.statusbar .msg b{display:block;font-family:var(--f-display);font-size:16px}
.issues{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--fail)}
.review{display:flex;flex-direction:column;gap:10px;width:100%}
.review .acts{display:flex;gap:8px;flex-wrap:wrap}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;scrollbar-width:thin}
.tab{border:0;background:none;padding:11px 12px 9px;border-bottom:3px solid transparent;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--fg-2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.tab .mini{font-family:var(--f-mono);font-size:11.5px;font-weight:400;color:var(--fg-3)}
.tabpane{display:flex;flex-direction:column;gap:20px}
.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.sumbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:16px;border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:var(--r);background:var(--surface)}
.sumbox h3{font-size:16px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;grid-column:1/-1}
.bar i{display:block;height:100%}
.bar .p{background:var(--pass)} .bar .f{background:var(--fail)} .bar .n{background:var(--na)}
.nums{display:flex;gap:12px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap;grid-column:1/-1}
.nums span{display:inline-flex;gap:5px;align-items:center}
.nums .k{width:8px;height:8px;border-radius:2px;display:inline-block}

.note{border:1px solid var(--line);border-inline-start:4px solid var(--acc);background:var(--acc-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--fg)}
.note.warn{border-inline-start-color:var(--warn);background:var(--warn-soft)}

.sec-h{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--acc);font-weight:500}
.sec-h h3{font-size:17px;font-weight:600;flex:1;min-width:0}
.sec-h h3 small{font-weight:400;color:var(--fg-3);font-size:14px;font-family:var(--f-body)}
.sec-h .c{font-family:var(--f-mono);font-size:12px;color:var(--fg-3)}
.grp{padding:8px 16px 4px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row .id{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);padding-top:2px}
.row .txt{min-width:0;overflow-wrap:anywhere}
.row .opt{font-size:11.5px;color:var(--fg-3);margin-left:6px}
.row.s-pass{box-shadow:inset 3px 0 0 var(--pass)}
.row.s-fail{box-shadow:inset 3px 0 0 var(--fail);background:color-mix(in srgb,var(--fail-soft) 45%,transparent)}
.row.s-na{box-shadow:inset 3px 0 0 var(--na)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13px;font-weight:600;min-width:52px;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"].pass{background:var(--pass);color:var(--surface)}
.seg button[aria-pressed="true"].fail{background:var(--fail);color:var(--surface)}
.seg button[aria-pressed="true"].na{background:var(--na);color:var(--surface)}
.extra{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.val{display:flex;align-items:stretch;flex:0 0 180px;direction:ltr}
.val .inp{border-radius:6px 0 0 6px;font-family:var(--f-mono)}
.val .u{border:1px solid var(--line-strong);border-left:0;border-radius:0 6px 6px 0;padding:7px 8px;font-size:13px;background:var(--surface-2);color:var(--fg-2);font-family:var(--f-mono);white-space:nowrap}
.extra .cmt{flex:1 1 220px;min-width:0}
.req{grid-column:2/-1;font-size:12.5px;color:var(--fail);font-weight:500}
.hint{grid-column:2/-1;font-size:12.5px;color:var(--fg-3)}
.photos{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:76px;height:58px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;inset-inline-end:2px;border:0;border-radius:4px;background:rgba(10,15,25,.72);color:#fff;font-size:11px;padding:1px 5px}
.thumb .x.arm{background:var(--fail)}
.addph{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px dashed var(--line-strong);border-radius:6px;padding:6px 10px;background:transparent;color:var(--fg-2)}
.addph:hover{border-color:var(--fg-3);color:var(--fg)}
.addph.need{border-color:var(--warn);color:var(--warn)}
.addph.busy{opacity:.6;pointer-events:none}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr)}
  .row .id{display:none}
  .extra,.req,.hint,.photos{grid-column:1/-1}
  .seg{justify-self:start}
  .val{flex:1 1 100%}
}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:6px}
.gcard .im{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.gcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.gadd{aspect-ratio:4/3;border:1.5px dashed var(--line-strong);border-radius:6px;background:transparent;color:var(--fg-2);display:grid;place-items:center;font-size:14px}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .inp{min-width:110px}
.tbl td.num{width:1%;font-family:var(--f-mono);color:var(--fg-3)}

.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sigbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sigbox h4{font-size:15px;font-weight:600}
.pad{position:relative;border:1px dashed var(--line-strong);border-radius:6px;background:#fff;height:110px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:6px}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8a93a6;font-size:13px;pointer-events:none}
.pad img{width:100%;height:100%;object-fit:contain;display:block}
.sigrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.loading{padding:40px 16px;text-align:center;color:var(--fg-3)}

.ucard{border:1px solid var(--line);border-inline-start:4px solid var(--line-strong);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ucard.u-ok{border-inline-start-color:var(--pass)} .ucard.u-damage{border-inline-start-color:var(--fail);background:color-mix(in srgb,var(--fail-soft) 40%,var(--surface))} .ucard.u-na{border-inline-start-color:var(--na)}
.ucard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ucard-h h3{font-size:17px;font-weight:600}
.uslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.uslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.uslot .photos{flex-wrap:wrap!important}
.ucard .req{grid-column:auto}

.gaprow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px}
.gaprow input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);flex:none}
.gaprow:has(input:checked){background:var(--surface-2)}

/* Right-to-left (Hebrew) */
.arw{display:inline-block}
[dir="rtl"] .arw{transform:scaleX(-1)}
[dir="rtl"] .row.s-pass{box-shadow:inset -3px 0 0 var(--pass)}
[dir="rtl"] .row.s-fail{box-shadow:inset -3px 0 0 var(--fail)}
[dir="rtl"] .row.s-na{box-shadow:inset -3px 0 0 var(--na)}
[dir="rtl"] .gcard .im .x{right:auto!important;left:4px}
.langbtn{border:1.5px solid color-mix(in srgb,currentColor 55%,transparent);background:transparent;color:inherit;border-radius:6px;padding:3px 10px;font-weight:600;font-size:14px;font-family:var(--f-body);min-width:44px}

<script type="text/plain" id="coreSrc">(function(){
"use strict";
const C = window.CFG;
const I = window.I18N || {lang:"en", T:(k, v) => k.replace(/\{(\w+)\}/g, (m, x) => v && v[x] != null ? v[x] : m), tr:s => s, translateNode(){}, onChange(){}, start(){}};
const T = (k, v) => I.T(k, v);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === "object" && !Array.isArray(o);
function deepMerge(t, s){ for (const k in s){ if (isObj(s[k])){ if (!isObj(t[k])) t[k] = {}; deepMerge(t[k], s[k]); } else t[k] = s[k]; } return t; }
function setPath(obj, path, val){ const ks = path.split("/"); let o = obj; for (let i = 0; i < ks.length - 1; i++){ if (!isObj(o[ks[i]])) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = val; }
function getPath(obj, path){ return path.split("/").reduce((o, k) => o == null ? undefined : o[k], obj); }
const fmtDate = t => t ? new Date(t).toLocaleString(I.lang === "he" ? "he-IL" : undefined, {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800); }
function setSync(t){ $("#sync").textContent = t; }
const DIS = () => editable() ? "" : "disabled";
const typing = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"); };

/* ---------- checklist items ---------- */
C.items = [];
let plainIdx = 0;
(C.sections || []).forEach((s, si) => { let n = 0; const sid = s.key ? s.key : "i" + String(++plainIdx).padStart(2,"0"); s.groups.forEach(g => { g.items = g.items.map(it => {
  const a = Array.isArray(it) ? it : [it]; n++;
  const o = {id:`${sid}${String(n).padStart(2,"0")}`, num:`${si+1}.${n}`, t:a[0], val:a[1] || null, optional:!!a[2], photo:!!s.photo};
  C.items.push(o); return o; }); }); });
function stats(r){ let pass=0, fail=0, na=0, missing=0, needPhoto=0;
  for (const it of C.items){ const x = r.results?.[it.id] || {};
    if (x.s === "pass") pass++; else if (x.s === "fail"){ fail++; if (!x.c) missing++; } else if (x.s === "na") na++;
    if (it.photo && !(x.photos || []).length && x.s !== "na") needPhoto++; }
  const total = C.items.length, done = pass + fail + na;
  return {pass, fail, na, done, total, missing, needPhoto, open: total - done}; }

/* ---------- status ---------- */
const STATUS = {draft:"Draft", submitted:"Submitted", accepted:"Accepted", returned:"Returned for correction"};
function statusOf(r){
  if (C.mode === "private") return r.status || "draft";
  if (!C.items.length) return "draft";
  const s = stats(r); return s.done === s.total ? (s.fail ? "fail" : "complete") : "progress";
}
function statusChip(st, sum){
  if (C.mode === "private") return `<span class="chip ${st}"><span class="dot"></span>${STATUS[st] || st}</span>`;
  const p = sum?.progress; const lab = st === "complete" ? "Complete" : st === "fail" ? "Complete with failures" : p && p.done ? "In progress" : "Not started";
  return `<span class="chip ${st === "progress" && !(p && p.done) ? "draft" : st}"><span class="dot"></span>${lab}</span>`;
}
function summarize(r){
  const s = C.items.length ? stats(r) : null;
  return { title: (r.f?.[C.titleField] || "").trim(), sub: (C.subFields || []).map(k => r.f?.[k]).filter(Boolean).join(" · "),
    ref: r.f?.ref || "", status: statusOf(r), updatedAt: r.updatedAt || 0, createdAt: r.createdAt || 0,
    progress: s ? {done:s.done, total:s.total, fail:s.fail} : null };
}

/* ---------- browser storage (IndexedDB, memory fallback) ---------- */
const idb = (() => {
  let dbp = null; const mem = new Map();
  function open(){ if (!dbp) dbp = new Promise((res, rej) => { try { const r = indexedDB.open("hs-" + C.key, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); return dbp; }
  async function run(mode, fn){ try { const d = await open(); return await new Promise((res, rej) => { const t = d.transaction("kv", mode); const req = fn(t.objectStore("kv")); t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); }); } catch(e){ return undefined; } }
  return {
    async get(k){ const v = await run("readonly", s => s.get(k)); return v === undefined ? mem.get(k) : v; },
    async set(k, v){ mem.set(k, v); await run("readwrite", s => { s.put(v, k); return null; }); },
    async del(k){ mem.delete(k); await run("readwrite", s => { s.delete(k); return null; }); },
    async all(prefix){ const out = new Map(); for (const [k, v] of mem) if (k.startsWith(prefix)) out.set(k, v);
      try { const d = await open(); await new Promise((res) => { const req = d.transaction("kv").objectStore("kv").openCursor();
        req.onsuccess = () => { const c = req.result; if (c){ if (String(c.key).startsWith(prefix)) out.set(c.key, c.value); c.continue(); } else res(); }; req.onerror = () => res(); }); } catch(e){}
      return [...out.values()]; }
  };
})();

/* ---------- photos: shrink before storing ---------- */
function shrink(file, maxDim, maxBytes){ return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = async () => { URL.revokeObjectURL(url); let m = maxDim, q = 0.8, blob = null;
    for (let i = 0; i < 6; i++){ const k = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      blob = await new Promise(r => c.toBlob(r, "image/jpeg", q)); if (!blob) break; if (!maxBytes || blob.size <= maxBytes) break; q = Math.max(0.5, q - 0.1); m = Math.round(m * 0.85); }
    blob ? res(blob) : rej({code:"unsupported_type"}); };
  img.onerror = () => { URL.revokeObjectURL(url); rej({code:"unsupported_type"}); }; img.src = url; }); }
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = () => r(null); f.readAsDataURL(b); });

/* ---------- backends ---------- */
function localPhotoRefs(r){ const out = []; const walk = v => { if (typeof v === "string"){ if (/^l:p/.test(v)) out.push(v); } else if (Array.isArray(v)) v.forEach(walk); else if (v && typeof v === "object") Object.values(v).forEach(walk); }; walk(r); return out; }
// Browser-only: reports live in this browser; used when the page can't save online.
function LocalBackend(){
  const reports = new Map(); let listCb = null;
  const emit = () => listCb && listCb([...reports.values()].map(r => ({id:r.id, uid:null, ...summarize(r)})));
  return { kind:"local", savedLabel: C.standalone ? "Saved on this phone" : "Saved in this browser",
    async init(){ (await idb.all("r:")).forEach(r => reports.set(r.id, r)); },
    reportPath: ref => "r:" + ref.id,
    subscribeList(cb){ listCb = cb; emit(); return () => {}; },
    subscribeReport(ref, cb){ cb(clone(reports.get(ref.id)) || null); return () => {}; },
    async create(r){ reports.set(r.id, r); await idb.set("r:" + r.id, r); emit(); return {id:r.id, uid:null}; },
    async write(path, patch){ const id = path.slice(2); const r = reports.get(id); if (!r) return; deepMerge(r, clone(patch)); await idb.set(path, r); emit(); },
    async remove(ref){ const r = reports.get(ref.id); reports.delete(ref.id); await idb.del("r:" + ref.id); for (const p of localPhotoRefs(r)) await idb.del("p:" + p.slice(2)); emit(); },
    async clearAll(){ for (const r of [...reports.values()]){ reports.delete(r.id); await idb.del("r:" + r.id); for (const p of localPhotoRefs(r)) await idb.del("p:" + p.slice(2)); } emit(); },
    async putPhoto(ref, file){ const b = await shrink(file, 1600, 900000); const pid = uid("p"); await idb.set("p:" + pid, await toDataURL(b)); return "l:" + pid; },
    async photoSrc(ref, p){ if (p.startsWith("l:")) return (await idb.get("p:" + p.slice(2))) || ""; return ""; },
    async delPhoto(ref, p){ if (p.startsWith("l:")) await idb.del("p:" + p.slice(2)); }
  };
}
// Shared: every report visible to everyone with access (team tools).
function SharedBackend(db, assets){
  const cache = new Map();
  return { kind:"shared", savedLabel:"Saved",
    async init(){},
    reportPath: ref => "reports/" + ref.id,
    subscribeList(cb, err){ return db.collection("reports").orderBy("updatedAt", "desc").limit(500).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, uid:null, ...summarize(d.data())}))), err); },
    subscribeReport(ref, cb, err){ return db.doc("reports/" + ref.id).onSnapshot(s => cb(s.exists ? clone(s.data()) : null), err); },
    async create(r){ await db.doc("reports/" + r.id).set(r); return {id:r.id, uid:null}; },
    async write(path, patch){ await db.doc(path).update(patch); },
    async remove(ref){ await db.doc("reports/" + ref.id).delete(); },
    async putPhoto(ref, file){
      if (assets){ try { const b = await shrink(file, 1920, 3000000); const res = await assets.upload(b, {type:"image/jpeg"}); return "a:" + res.id; } catch(e){ if (e && (e.code === "too_large" || e.code === "unsupported_type")) throw e; } }
      const b = await shrink(file, 1280, 190000); const pid = uid("p"); await db.doc("photos/" + pid).set({data: await toDataURL(b), report: ref.id}); return "d:" + pid; },
    async photoSrc(ref, p){ if (p.startsWith("a:")) return "/_blob/" + p.slice(2);
      if (p.startsWith("d:")){ if (!cache.has(p)) cache.set(p, db.doc("photos/" + p.slice(2)).get().then(s => s.exists ? s.data().data : "").catch(() => "")); return cache.get(p); } return ""; },
    async delPhoto(ref, p){ try { if (p.startsWith("a:") && assets) await assets.delete(p.slice(2)); if (p.startsWith("d:")) await db.doc("photos/" + p.slice(2)).delete(); } catch(e){} }
  };
}
// Private: each submitter sees only their own reports; the page owner sees everyone's.
function PrivateBackend(db, me){
  const cache = new Map();
  const base = ref => `subs/${ref.uid}`;
  return { kind:"private", savedLabel:"Saved",
    async init(){ const ix = db.doc("subs/" + me); const s = await ix.get(); if (!s.exists) await ix.set({reports:{}, updatedAt:Date.now()}); },
    reportPath: ref => `${base(ref)}/reports/${ref.id}`,
    indexPath: ref => base(ref),
    subscribeList(cb, err){ return db.collection("subs").onSnapshot(s => { const out = [];
      s.docs.forEach(d => { const reps = d.data().reports || {}; for (const id in reps) if (reps[id]) out.push({id, uid:d.id, ...reps[id]}); });
      cb(out); }, err); },
    subscribeReport(ref, cb, err){ return db.doc(`${base(ref)}/reports/${ref.id}`).onSnapshot(s => cb(s.exists ? clone(s.data()) : null), err); },
    async create(r){ const ref = {id:r.id, uid:me}; await db.doc(`${base(ref)}/reports/${r.id}`).set(r);
      await db.doc(base(ref)).update({reports:{[r.id]: summarize(r)}, updatedAt:Date.now()}); return ref; },
    async write(path, patch){ await db.doc(path).update(patch); },
    async remove(ref){ await db.doc(`${base(ref)}/reports/${ref.id}`).delete(); await db.doc(base(ref)).update({reports:{[ref.id]: null}, updatedAt:Date.now()}); },
    async putPhoto(ref, file){ const b = await shrink(file, 1280, 190000); const pid = uid("p"); await db.doc(`${base(ref)}/photos/${pid}`).set({data: await toDataURL(b), report: ref.id}); return "d:" + pid; },
    async photoSrc(ref, p){ if (!p.startsWith("d:")) return ""; const k = ref.uid + p; if (!cache.has(k)) cache.set(k, db.doc(`${base(ref)}/photos/${p.slice(2)}`).get().then(s => s.exists ? s.data().data : "").catch(() => "")); return cache.get(k); },
    async delPhoto(ref, p){ try { if (p.startsWith("d:")) await db.doc(`${base(ref)}/photos/${p.slice(2)}`).delete(); } catch(e){} }
  };
}

/* ---------- state ---------- */
const S = { B:null, list:null, ref:null, r:null, tab:0, me:null, isOwner:false, readOnly:false, localReason:null,
  downloads:null, user:null, names:{}, filter:"all", unsub:null, keepScroll:false };
let B = null;

/* ---------- write queue: merged, debounced, one write at a time per document ---------- */
const W = {pending:new Map(), busy:new Set(), timers:new Map()};
function queue(path, patch){ const p = W.pending.get(path) || {}; deepMerge(p, clone(patch)); W.pending.set(path, p);
  clearTimeout(W.timers.get(path)); W.timers.set(path, setTimeout(() => flush(path), 600)); setSync("Saving…"); }
async function flush(path){
  if (W.busy.has(path)){ W.timers.set(path, setTimeout(() => flush(path), 400)); return; }
  const p = W.pending.get(path); if (!p) return; W.pending.delete(path); W.busy.add(path);
  try { await B.write(path, p); setSync(B.savedLabel); }
  catch(e){ if (e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 700 + Math.random()*700)); try { await B.write(path, p); setSync(B.savedLabel); } catch(e2){ writeErr(e2); } } else writeErr(e); }
  finally { W.busy.delete(path); }
}
function writeErr(e){
  const c = e && e.code;
  if (c === "invalid_argument"){ S.readOnly = true; setSync("View only"); render(); toast("You can view this page but not change it."); }
  else if (c === "quota_exceeded" || c === "quota_or_state"){ setSync("Storage full"); toast("Storage for this page is full. Delete old reports or photos, then try again."); }
  else { setSync("Not saved"); toast("Couldn't save the last change. Check your connection."); }
}

/* ---------- permissions ---------- */
function mine(){ return !S.ref || C.mode !== "private" || S.ref.uid === S.me || B.kind === "local"; }
function editable(){
  if (S.readOnly || !S.r) return false;
  if (C.mode === "private" && B.kind === "private"){ if (!mine()) return false; if (["submitted","accepted"].includes(S.r.status)) return false; }
  if (B.kind === "local" && ["submitted","accepted"].includes(S.r.status)) return false;
  return true;
}

/* ---------- change tracking ---------- */
function change(path, val, opt = {}){
  if (!opt.force && !editable()) return;
  setPath(S.r, path, val); S.r.updatedAt = Date.now();
  const patch = {}; setPath(patch, path, val); patch.updatedAt = S.r.updatedAt;
  queue(B.reportPath(S.ref), patch); syncIndex();
  if (opt.rerender){ S.keepScroll = true; render(); } else refreshCounts();
}
function changeMany(patch, opt = {}){
  deepMerge(S.r, clone(patch)); S.r.updatedAt = Date.now(); patch.updatedAt = S.r.updatedAt;
  queue(B.reportPath(S.ref), patch); syncIndex(true); if (opt.rerender !== false){ S.keepScroll = true; render(); }
}
let lastIx = "";
function syncIndex(force){ if (B.kind !== "private") return; const s = summarize(S.r); const key = JSON.stringify({...s, updatedAt:0});
  if (!force && key === lastIx && Date.now() - (syncIndex.t || 0) < 30000) return; lastIx = key; syncIndex.t = Date.now();
  queue(B.indexPath(S.ref), {reports:{[S.ref.id]: s}, updatedAt:Date.now()}); }

/* ---------- create / open ---------- */
function blankReport(){
  const f = {date: today()}; if (!C.noRef) f.ref = ((C.refPrefix || "R") + "-" + today().replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase());
  (C.tabs || []).forEach(t => t.blocks.forEach(b => {
    if (b.type === "table") f[b.k] = (b.rows || []).map(row => Object.fromEntries(b.cols.map((c, i) => [c.k, typeof row[i] === "string" ? T(row[i]) : (row[i] ?? "")])));
    if (b.type === "fields") b.fields.forEach(fd => { if (fd.t === "date" && fd.k !== "date" && fd.today) f[fd.k] = today(); });
  }));
  return {id: uid("r"), createdAt: Date.now(), updatedAt: Date.now(), status: "draft", f, results:{}, signoff:{}, review:null};
}
async function createReport(){
  if (S.readOnly) return; const r = blankReport();
  try { const ref = await B.create(r); openReport(ref, r); }
  catch(e){ writeErr(e); }
}
function openReport(ref, initial){
  if (S.unsub) S.unsub(); S.ref = ref; S.r = initial ? clone(initial) : null; S.tab = 0; render(); window.scrollTo(0,0);
  S.unsub = B.subscribeReport(ref, data => {
    if (!S.ref || S.ref.id !== ref.id) return;
    if (!data){ if (S.r && !initial){ toast("This report was deleted."); goHome(); } return; }
    initial = null;
    const p = W.pending.get(B.reportPath(ref)); if (p) deepMerge(data, clone(p));
    if (S.r && JSON.stringify(data) === JSON.stringify(S.r)) return;
    const first = !S.r; S.r = data;
    if (first || (!typing() && !drawing)){ S.keepScroll = !first; render(); }
  }, () => { setSync("Offline"); toast("Lost connection. Reload the page to reconnect."); });
}
function goHome(){ if (S.unsub) S.unsub(); S.unsub = null; S.ref = null; S.r = null; render(); window.scrollTo(0,0); }

/* ---------- render ---------- */
function render(){
  const app = $("#app"); const y = window.scrollY;

function canDeleteRow(x){ if (S.readOnly) return false; if (B.kind === "local" || B.kind === "shared") return true; return x.uid === S.me && !["submitted","accepted"].includes(x.status); }

      <div class="nums"><span><i class="k" style="background:var(--pass)"></i>${T("{n} pass", {n:s.pass})}</span><span><i class="k" style="background:var(--fail)"></i>${T("{n} fail", {n:s.fail})}</span><span><i class="k" style="background:var(--na)"></i>${T("{n} N/A", {n:s.na})}</span>${s.missing ? `<span style="color:var(--fail)">${T("{n} failed without comment", {n:s.missing})}</span>` : ""}${s.needPhoto && C.photoRequiredLabel ? `<span style="color:var(--warn)">${T(s.needPhoto > 1 ? "{n} required photos missing" : "{n} required photo missing", {n:s.needPhoto})}</span>` : ""}</div></section>`; }
  case "fields": return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="panel-b grid">${b.fields.map(fd => inputHTML("f/" + fd.k, fd)).join("")}</div></section>`;
  case "choice": { const multi = b.multi; const v = r.f?.[b.k];
    const body = `<div class="pills" role="${multi ? "group" : "radiogroup"}" aria-label="${esc(b.l)}">${b.options.map((o, i) => { const on = multi ? !!(v && v[o.k]) : v === o.k;
      return `<label class="pill"><input type="${multi ? "checkbox" : "radio"}" name="ch-${b.k}" id="ch-${b.k}-${i}" data-choice="${b.k}" data-opt="${o.k}" ${on ? "checked" : ""} ${DIS()}>${esc(o.l)}</label>`; }).join("")}</div>`;
    if (b.inline) return `<div class="field"><span class="flabel">${esc(b.l)}</span>${body}</div>`;
    return `<section class="panel"><div class="panel-h"><h2>${esc(b.l)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="panel-b">${body}</div></section>`; }
  case "group": return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="panel-b" style="display:flex;flex-direction:column;gap:14px">${b.blocks.map(x => x.type === "fields" ? `<div class="grid">${x.fields.map(fd => inputHTML("f/" + fd.k, fd)).join("")}</div>` : blockHTML({...x, inline:true})).join("")}</div></section>`;
  case "table": { const rows = r.f?.[b.k] || [];
    if (b.cards) return tableCardsHTML(b, rows);
    return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="tbl-wrap"><table class="tbl"><thead><tr>${b.numbered ? "<th>#</th>" : ""}${b.cols.map(c => `<th>${esc(c.l)}</th>`).join("")}${editable() && b.addable !== false ? "<th></th>" : ""}</tr></thead><tbody>
      ${rows.map((row, i) => `<tr>${b.numbered ? `<td class="num">${i+1}</td>` : ""}${b.cols.map(c => `<td>${c.t === "photo" ? photoCellHTML(b, c, row, i) : c.fixed ? esc(row[c.k]) : c.t === "select" ? `<select class="inp" id="t-${b.k}-${i}-${c.k}" data-tbl="${b.k}" data-row="${i}" data-col="${c.k}" aria-label="${esc(c.l)} row ${i+1}" ${DIS()}><option value=""></option>${c.opts.map(o => `<option value="${esc(o)}"${row[c.k] === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<input class="inp${c.mono ? " mono" : ""}" dir="auto" id="t-${b.k}-${i}-${c.k}" data-tbl="${b.k}" data-row="${i}" data-col="${c.k}" type="${c.t || "text"}" value="${esc(row[c.k])}" aria-label="${esc(c.l)} row ${i+1}" ${DIS()}>`}</td>`).join("")}${editable() && b.addable !== false ? `<td style="width:1%"><button class="btn btn-ghost btn-sm" data-tblrm="${b.k}" data-row="${i}" aria-label="Remove row ${i+1}">Remove</button></td>` : ""}</tr>`).join("")}
      </tbody></table></div>${editable() && b.addable !== false ? `<div class="panel-b" style="padding-top:10px"><button class="btn btn-sm" data-tbladd="${b.k}">${esc(b.addLabel || "Add row")}</button></div>` : ""}</section>`; }
  case "gallery": { const items = r.f?.[b.k] || [];
    return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="panel-b"><div class="gallery">
      ${items.map((g, i) => `<div class="gcard"><div class="im"><img data-ph="${esc(g.p)}" alt="${esc(g.cap || "Site photo " + (i+1))}">${editable() ? `<button class="thumb-x x" style="position:absolute;top:4px;right:4px;border:0;border-radius:4px;background:rgba(10,15,25,.72);color:#fff;font-size:12px;padding:2px 7px" data-grm="${b.k}" data-i="${i}" aria-label="Remove photo">×</button>` : ""}</div>
        <input class="inp" dir="auto" id="g-${b.k}-${i}" data-gcap="${b.k}" data-i="${i}" placeholder="Caption" value="${esc(g.cap || "")}" aria-label="Caption for photo ${i+1}" ${DIS()}></div>`).join("")}
      ${editable() ? `<button class="gadd" data-gadd="${b.k}">${CAM} Add photo</button>` : items.length ? "" : `<span class="muted">No photos.</span>`}
    </div></div></section>`; }
  case "checklist": return checklistHTML(b);
  case "unitcards": { const rows = r.f?.[b.k] || []; const tb = findBlock(b.k);
    return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div>
      <div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
      ${rows.length ? rows.map((row, i) => { const res = row.result || "";
        return `<div class="ucard ${res ? "u-" + res : ""}"><div class="ucard-h"><h3>${esc(row.name || b.unitLabel + " " + (i+1))}</h3>${row.sn ? `<span class="mono muted notr">SN ${esc(row.sn)}</span>` : ""}
          <div class="seg" role="group" aria-label="Result for ${esc(row.name || "")}" style="margin-inline-start:auto">${[["ok","No damage","pass"],["damage","Damage found","fail"],["na","N/A","na"]].map(([k,l,cls]) => `<button type="button" class="${cls}" data-ucst="${b.k}" data-row="${i}" data-val="${k}" aria-pressed="${res === k}" ${editable() ? "" : "disabled"}>${l}</button>`).join("")}</div></div>
          <div class="uslots">${b.slots.map(sl => `<div class="uslot"><span class="flabel">${esc(sl.l)}</span>${photoCellHTML(b, sl, row, i)}</div>`).join("")}</div>
          <input class="inp" dir="auto" id="t-${b.k}-${i}-note" data-tbl="${b.k}" data-row="${i}" data-col="note" value="${esc(row.note || "")}" placeholder="${res === "damage" ? "Describe the damage and where it is" : "Comment"}" aria-label="Comment for ${esc(row.name || "")}" ${DIS()}>
          ${res === "damage" && !row.note ? `<div class="req">Describe the damage.</div>` : ""}</div>`; }).join("") : `<p class="muted" style="margin:0">No units yet.</p>`}
      ${editable() ? `<div><button class="btn btn-sm" data-tbladd="${b.k}">${esc((tb && tb.addLabel) || "Add unit")}</button></div>` : ""}
      </div></section>`; }
  case "signoff": return `<section class="panel"><div class="panel-h"><h2>${esc(b.title || "Sign-off")}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div><div class="panel-b sign">
    ${b.roles.map((role, ri) => { const k = "s" + ri, so = r.signoff?.[k] || {}; return `<div class="sigbox"><h4>${esc(role)}</h4>
      ${inputHTML(`signoff/${k}/name`, {l:"Name"})}${inputHTML(`signoff/${k}/date`, {l:"Date", t:"date"})}
      <div class="pad" data-pad="${k}">${so.sig ? `<img src="${so.sig}" alt="Signature of ${esc(so.name || role)}">` : editable() ? `<canvas aria-label="Signature pad for ${esc(role)}"></canvas><span class="ph">Sign here</span>` : `<span class="ph">Not signed</span>`}</div>
      <div class="sigrow"><span>${so.sig ? "Signed" : editable() ? "Draw with finger or mouse" : ""}</span>${editable() && so.sig ? `<button class="btn btn-ghost btn-sm" data-sigclear="${k}">Clear</button>` : ""}</div></div>`; }).join("")}</div></section>`;
  }
  return "";
}

// Table shown as one card per row (better on phones: every field and photo is visible without side-scrolling)
function tcellHTML(b, c, row, i){
  if (c.t === "photo") return photoCellHTML(b, c, row, i);
  if (c.t === "select") return `<select class="inp" id="t-${b.k}-${i}-${c.k}" data-tbl="${b.k}" data-row="${i}" data-col="${c.k}" aria-label="${esc(c.l)} ${i+1}" ${DIS()}><option value=""></option>${c.opts.map(o => `<option value="${esc(o)}"${row[c.k] === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  return `<input class="inp${c.mono ? " mono" : ""}" dir="auto" id="t-${b.k}-${i}-${c.k}" data-tbl="${b.k}" data-row="${i}" data-col="${c.k}" type="${c.t || "text"}" value="${esc(row[c.k] ?? "")}" aria-label="${esc(c.l)} ${i+1}" ${DIS()}>`;
}
function tableCardsHTML(b, rows){
  const fx = b.cols.filter(c => c.fixed), ed = b.cols.filter(c => !c.fixed), canAdd = editable() && b.addable !== false;
  return `<section class="panel"><div class="panel-h"><h2>${esc(b.title)}</h2>${b.hint ? `<span class="muted">${esc(b.hint)}</span>` : ""}</div>
    <div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
    ${rows.length ? rows.map((row, i) => { const st = row.status === "Closed" ? " u-ok" : row.status === "Open" ? " u-open" : "";
      return `<div class="ucard tcard${st}"><div class="ucard-h"><h3>${b.numbered ? `<span class="mono muted">${i+1}.</span> ` : ""}${fx.length ? esc(row[fx[0].k]) : esc(b.rowLabel || "Item") + " " + (i+1)}</h3>
        ${canAdd ? `<button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" data-tblrm="${b.k}" data-row="${i}" aria-label="Remove ${i+1}">Remove</button>` : ""}</div>
        ${fx.slice(1).map(c => `<div class="tfix"><span class="flabel">${esc(c.l)}</span><span>${esc(row[c.k])}</span></div>`).join("")}
        <div class="tgrid">${ed.map(c => `<div class="tfld${c.t === "photo" || c.full ? " full" : ""}"><span class="flabel">${esc(c.l)}</span>${tcellHTML(b, c, row, i)}</div>`).join("")}</div></div>`; }).join("")
      : `<p class="muted" style="margin:0">${esc(b.emptyText || "Nothing added yet.")}</p>`}
    ${canAdd ? `<div><button class="btn btn-sm" data-tbladd="${b.k}">${esc(b.addLabel || "Add row")}</button></div>` : ""}
    </div></section>`;
}
function photoCellHTML(b, c, row, i){
  const ph = Array.isArray(row[c.k]) ? row[c.k] : [];
  return `<div class="photos" style="flex-wrap:nowrap">${ph.map(p => `<span class="thumb"><img data-ph="${esc(p)}" alt="${esc(c.l)} ${esc(row.name || "row " + (i+1))}">${editable() ? `<button class="x" data-tphrm="${esc(p)}" data-tbl="${b.k}" data-row="${i}" data-col="${c.k}" aria-label="Remove photo">×</button>` : ""}</span>`).join("")}
    ${editable() ? `<button class="addph" data-tph="${b.k}" data-row="${i}" data-col="${c.k}" aria-label="Add ${esc(c.l)} for ${esc(row.name || "row " + (i+1))}">${CAM}<span>${ph.length ? "Add" : "Photo"}</span></button>` : ph.length ? "" : `<span class="muted">—</span>`}</div>`;
}
// Which sections a checklist block shows: "only" picks keyed sections (e.g. safety); the default block shows the rest
function secsOf(b){ return (C.sections || []).map((s, si) => [s, si]).filter(([s]) => b && b.only ? b.only.includes(s.key) : !s.key); }
function checklistHTML(b){
  const r = S.r;
  return secsOf(b).map(([s, si]) => { const ids = s.groups.flatMap(g => g.items.map(i => i.id)); const done = ids.filter(id => r.results?.[id]?.s).length;
    return `<section class="panel"><div class="sec-h"><span class="n">${si+1}</span><h3><span>${esc(s.t)}</span>${s.sub ? ` <small>· <span>${esc(s.sub)}</span></small>` : ""}</h3><span class="c" data-secc="${si}">${done}/${ids.length}</span>
      ${editable() && !s.photo ? `<button class="btn btn-ghost btn-sm" data-allpass="${si}" title="Mark unanswered items in this section as Pass">Pass remaining</button>` : ""}</div>
      ${s.note ? `<div class="note warn" style="margin:12px 16px 0">${esc(s.note)}</div>` : ""}
      ${s.groups.map(g => `${g.t ? `<div class="grp">${esc(g.t)}</div>` : ""}${g.items.map(rowHTML).join("")}`).join("")}</section>`; }).join("");
}
function rowHTML(it){
  const x = S.r.results?.[it.id] || {}, s = x.s || "", ph = x.photos || [], ed = editable();
  return `<div class="row ${s ? "s-" + s : ""}" data-row="${it.id}">
    <span class="id">${it.num}</span>
    <div class="txt">${esc(it.t)}${it.optional ? `<span class="opt">optional</span>` : ""}</div>
    <div class="seg" role="group" aria-label="Result for ${it.num}">${[["pass","Pass"],["fail","Fail"],["na","N/A"]].map(([k,l]) => `<button type="button" class="${k}" data-st="${k}" data-item="${it.id}" aria-pressed="${s === k}" ${ed ? "" : "disabled"}>${l}</button>`).join("")}</div>
    <div class="extra">
      ${it.val ? `<div class="val"><input class="inp" id="v-${it.id}" data-v="${it.id}" inputmode="decimal" placeholder="Value" value="${esc(x.v || "")}" aria-label="Measured value in ${esc(it.val.unit)}" ${ed ? "" : "disabled"}><span class="u">${esc(it.val.unit)}</span></div>` : ""}
      <input class="inp cmt" dir="auto" id="c-${it.id}" data-c="${it.id}" placeholder="${s === "fail" ? "Describe the failure and corrective action" : "Comment"}" value="${esc(x.c || "")}" aria-label="Comment for ${it.num}" ${ed ? "" : "disabled"}>
    </div>
    ${it.val && it.val.hint ? `<div class="hint">${esc(it.val.hint)}</div>` : ""}
    <div class="req" data-req="${it.id}" ${s === "fail" && !x.c ? "" : "hidden"}>A failed item needs a comment.</div>
    ${(ed || ph.length) && (C.itemPhotos !== false || it.photo) ? `<div class="photos">${ph.map(p => `<span class="thumb"><img data-ph="${esc(p)}" alt="Photo for item ${it.num}">${ed ? `<button class="x" data-rmph="${esc(p)}" data-item="${it.id}" aria-label="Remove photo">×</button>` : ""}</span>`).join("")}
      ${ed ? `<button class="addph${it.photo && !ph.length && s !== "na" ? " need" : ""}" data-addph="${it.id}">${CAM}<span>${it.photo && !ph.length ? "Add required photo" : "Add photo"}</span></button>` : ""}</div>` : ""}
  </div>`;
}

function refreshCounts(){
  const r = S.r; if (!r) return; const s = stats(r);
  $$("[data-mini]").forEach(el => el.textContent = `${s.done}/${s.total}`);
  $$("[data-secc]").forEach(el => { const sec = C.sections[+el.dataset.secc]; const ids = sec.groups.flatMap(g => g.items.map(i => i.id)); el.textContent = `${ids.filter(id => r.results?.[id]?.s).length}/${ids.length}`; });
}
function updateRow(id){
  const row = document.querySelector(`[data-row="${id}"]`); if (!row) return; const x = S.r.results?.[id] || {};
  row.className = "row" + (x.s ? " s-" + x.s : "");
  row.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.st === x.s)));
  const q = row.querySelector("[data-req]"); if (q) q.hidden = !(x.s === "fail" && !x.c);
  const c = row.querySelector("[data-c]"); if (c){ c.placeholder = x.s === "fail" ? "Describe the failure and corrective action" : "Comment"; if (x.s === "fail" && !x.c) c.focus(); }
  const it = C.items.find(i => i.id === id); const ab = row.querySelector(".addph"); if (ab && it) ab.classList.toggle("need", it.photo && !(x.photos || []).length && x.s !== "na");
}

/* ---------- binding ---------- */
function bindReport(){
  $("#backBtn").onclick = goHome;
  $$("[data-tab]").forEach(b => b.addEventListener("click", () => { S.tab = +b.dataset.tab; render(); const t = $(".tabs"); if (t && window.scrollY > t.offsetTop) window.scrollTo({top: Math.max(0, t.offsetTop - 60)}); }));
  $("#exportBtn")?.addEventListener("click", () => exportReport("html"));
  $("#pdfBtn")?.addEventListener("click", () => exportReport("pdf"));
  $("#wordBtn")?.addEventListener("click", () => exportReport("word"));
  $("#submitBtn")?.addEventListener("click", trySubmit);
  $("#withdrawBtn")?.addEventListener("click", () => { changeMany({status:"draft"}); toast("Withdrawn. You can edit the report again."); });
  $$("[data-review]").forEach(b => b.onclick = () => doReview(b.dataset.review));
  if (!editable()) return;
  $$("[data-f]").forEach(el => el.addEventListener("input", () => { const path = el.dataset.f; change(path, el.value);
    if (path === "f/" + C.titleField) { const h = $(".rhead h2"); if (h) h.textContent = el.value || T(C.appName); } }));
  $$("[data-choice]").forEach(el => el.addEventListener("change", () => { const k = el.dataset.choice, b = findBlock(k);
    if (b.multi) change(`f/${k}/${el.dataset.opt}`, el.checked); else change(`f/${k}`, el.dataset.opt); }));
  $$("[data-tbl]").forEach(el => el.addEventListener("input", () => { const rows = clone(S.r.f[el.dataset.tbl] || []); rows[+el.dataset.row][el.dataset.col] = el.value; change("f/" + el.dataset.tbl, rows); }));
  $$("[data-tbladd]").forEach(b => b.onclick = () => { const k = b.dataset.tbladd, bl = findBlock(k); const rows = clone(S.r.f[k] || []); const nr = Object.fromEntries(bl.cols.map(c => [c.k, c.t === "photo" ? [] : ""])); if (bl.autoName) nr[bl.cols[0].k] = bl.autoName + " " + (rows.length + 1); rows.push(nr); change("f/" + k, rows, {rerender:true}); });
  $$("[data-tblrm]").forEach(b => b.onclick = () => { const k = b.dataset.tblrm; const rows = clone(S.r.f[k] || []); rows.splice(+b.dataset.row, 1); change("f/" + k, rows, {rerender:true}); });
  $$("[data-gadd]").forEach(b => b.onclick = () => pickPhoto({gallery:b.dataset.gadd}, b));
  $$("[data-ucst]").forEach(b => b.onclick = () => { const k = b.dataset.ucst, rows = clone(S.r.f[k] || []), row = rows[+b.dataset.row]; if (!row) return; row.result = row.result === b.dataset.val ? "" : b.dataset.val; change("f/" + k, rows, {rerender:true}); });
  $$("[data-fph]").forEach(b => b.onclick = () => pickPhoto({field:b.dataset.fph}, b));
  $$("[data-fphrm]").forEach(b => b.onclick = () => armThen(b, () => { const path = b.dataset.path, p = b.dataset.fphrm; const cur = getPath(S.r, path); change(path, (Array.isArray(cur) ? cur : []).filter(x => x !== p), {rerender:true}); B.delPhoto(S.ref, p); }));
  $$("[data-tph]").forEach(b => b.onclick = () => pickPhoto({table:b.dataset.tph, row:+b.dataset.row, col:b.dataset.col}, b));
  $$("[data-tphrm]").forEach(b => b.onclick = () => armThen(b, () => { const k = b.dataset.tbl, rows = clone(S.r.f[k] || []), row = rows[+b.dataset.row]; const p = b.dataset.tphrm;
    row[b.dataset.col] = (Array.isArray(row[b.dataset.col]) ? row[b.dataset.col] : []).filter(x => x !== p); change("f/" + k, rows, {rerender:true}); B.delPhoto(S.ref, p); }));
  $$("[data-gcap]").forEach(el => el.addEventListener("input", () => { const k = el.dataset.gcap; const a = clone(S.r.f[k] || []); a[+el.dataset.i].cap = el.value; change("f/" + k, a); }));
  $$("[data-grm]").forEach(b => b.onclick = () => armThen(b, () => { const k = b.dataset.grm; const a = clone(S.r.f[k] || []); const [g] = a.splice(+b.dataset.i, 1); change("f/" + k, a, {rerender:true}); if (g) B.delPhoto(S.ref, g.p); }));
  $$("[data-st]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.item; const cur = S.r.results?.[id]?.s; change(`results/${id}/s`, cur === b.dataset.st ? "" : b.dataset.st); updateRow(id); }));
  $$("[data-c]").forEach(el => el.addEventListener("input", () => { const id = el.dataset.c; change(`results/${id}/c`, el.value); const q = document.querySelector(`[data-req="${id}"]`); if (q) q.hidden = !(S.r.results[id].s === "fail" && !el.value); }));
  $$("[data-v]").forEach(el => el.addEventListener("input", () => change(`results/${el.dataset.v}/v`, el.value)));
  $$("[data-allpass]").forEach(b => b.onclick = () => { const s = C.sections[+b.dataset.allpass]; const patch = {}; let n = 0;
    s.groups.forEach(g => g.items.forEach(it => { if (!S.r.results?.[it.id]?.s){ patch[it.id] = {s:"pass"}; n++; } }));
    if (!n){ toast("Every item in this section already has a result."); return; } changeMany({results:patch}); toast(T(n > 1 ? "{n} items marked Pass" : "{n} item marked Pass", {n})); });
  $$("[data-addph]").forEach(b => b.onclick = () => pickPhoto({item:b.dataset.addph}, b));
  $$("[data-rmph]").forEach(b => b.onclick = () => armThen(b, () => { const id = b.dataset.item, p = b.dataset.rmph; change(`results/${id}/photos`, (S.r.results?.[id]?.photos || []).filter(x => x !== p), {rerender:true}); B.delPhoto(S.ref, p); }));
  $$("[data-sigclear]").forEach(b => b.onclick = () => change(`signoff/${b.dataset.sigclear}/sig`, "", {rerender:true}));
  const del = $("#delBtn"); if (del) del.onclick = () => { $("#delWrap").innerHTML = `<div class="confirm"><span>Delete this report? This can't be undone.</span><button class="btn btn-sm" id="delNo">Keep it</button><button class="btn btn-danger btn-sm" id="delYes">Delete</button></div>`;
    $("#delNo").onclick = () => { S.keepScroll = true; render(); }; $("#delYes").onclick = async () => { const ref = S.ref; goHome(); try { await B.remove(ref); toast("Report deleted"); } catch(e){ writeErr(e); } }; };

function findBlock(k){ for (const t of C.tabs) for (const b of t.blocks){ if (b.k === k) return b; if (b.blocks) for (const x of b.blocks) if (x.k === k) return x; } return {}; }

  const roles = signRoles(); const unsigned = roles.filter((_, i) => !S.r.signoff?.["s" + i]?.sig);

let drawing = false;
function drawPads(){

    const pad = cv.parentElement, k = pad.dataset.pad, ph = pad.querySelector(".ph");
    const dpr = window.devicePixelRatio || 1, w = pad.clientWidth, h = pad.clientHeight; cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1f4d";
    let last = null, inked = false;

    cv.addEventListener("pointerdown", e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); if (ph) ph.hidden = true; });
    cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; inked = true; });
    const end = () => { if (!drawing) return; drawing = false; if (!inked) return;

}

async function exportReport(kind, opts = {}){

    app.innerHTML = '<div class="loading">' + T("Loading…") + '</div>';
    const a = document.createElement("script"); a.textContent = plain; document.body.appendChild(a);
    const b = document.createElement("script"); b.textContent = document.getElementById("coreSrc").textContent; document.body.appendChild(b);
    return true;
  }
  function ask(err){
    app.innerHTML = `<form class="lock" id="lockf"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <h2>${T("Password required")}</h2><p>${T("Enter the password to open this form.")}</p>
      <input class="inp" id="pw" type="password" autocomplete="current-password" aria-label="${T("Password")}" placeholder="${T("Password")}">
      ${err ? `<p class="err">${T(err)}</p>` : ""}<button class="btn btn-primary" type="submit">${T("Open")}</button></form>`;
    const f = document.getElementById("lockf"), pw = document.getElementById("pw"); pw.focus();
    f.onsubmit = async e => { e.preventDefault(); if (!pw.value) return; const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = T("Opening…");
      if (!(await tryOpen(pw.value))) ask("Wrong password. Try again."); };
  }
  let saved = null; try { saved = sessionStorage.getItem(K); } catch(e){}
  if (saved) tryOpen(saved).then(ok => { if (!ok) ask(); }); else ask();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
